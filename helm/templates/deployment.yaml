{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    cloud: {{ $.Values.cloud.provider }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ $svc.port | default 8000 }}
          envFrom:
            - configMapRef:
                name: ai-finops-config
            - secretRef:
                name: ai-finops-secrets
          {{- if $svc.env }}
          env:
          {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
          {{- end }}
          {{- end }}
          resources:
            requests:
              cpu: {{ (($svc.resources).requests).cpu | default "100m" }}
              memory: {{ (($svc.resources).requests).memory | default "256Mi" }}
            limits:
              cpu: {{ (($svc.resources).limits).cpu | default "500m" }}
              memory: {{ (($svc.resources).limits).memory | default "512Mi" }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port | default 8000 }}
            initialDelaySeconds: 15
            periodSeconds: 30
{{- end }}
{{- end }}
