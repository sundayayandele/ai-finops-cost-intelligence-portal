version: "3.9"
# Infrastructure only — use for CI or when running services outside Docker
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: finops-infra-01
    volumes: [kafka-infra-data:/var/lib/kafka/data]

  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: ai_costs
    volumes: [timescale-infra-data:/var/lib/postgresql/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse-infra-data:/var/lib/clickhouse]

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    volumes: [redis-infra-data:/data]

volumes:
  kafka-infra-data: {}
  timescale-infra-data: {}
  clickhouse-infra-data: {}
  redis-infra-data: {}
