version: "3.9"

x-common: &common
  restart: unless-stopped
  networks: [finops]

x-py-env: &py-env
  KAFKA_BOOTSTRAP: kafka:9092
  TIMESCALE_DSN: postgresql://finops:finops@timescaledb:5432/ai_costs
  CLICKHOUSE_HOST: clickhouse
  REDIS_URL: redis://redis:6379

services:
  # ── Infrastructure ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    <<: *common
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: finops-cluster-01
    volumes: [kafka-data:/var/lib/kafka/data]

  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    <<: *common
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops
      POSTGRES_DB: ai_costs
    volumes: [timescale-data:/var/lib/postgresql/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    <<: *common
    ports: ["8123:8123", "9000:9000"]
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }

  redis:
    image: redis:7.2-alpine
    <<: *common
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  # ── AI FinOps Microservices ────────────────────────────
  azure-ingestor:
    build: ./services/azure-ingestor
    <<: *common
    ports: ["8001:8001"]
    environment:
      <<: *py-env
      AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT}
    depends_on: [kafka]

  openstack-ingestor:
    build: ./services/openstack-ingestor
    <<: *common
    ports: ["8002:8002"]
    environment:
      <<: *py-env
      OS_AUTH_URL: ${OS_AUTH_URL}
      OS_USERNAME: ${OS_USERNAME}
      OS_PASSWORD: ${OS_PASSWORD}
      OS_PROJECT_NAME: ${OS_PROJECT_NAME}
      OS_REGION_NAME: ${OS_REGION_NAME:-RegionOne}
      GNOCCHI_URL: ${GNOCCHI_URL}
      VLLM_METRICS_URLS: ${VLLM_METRICS_URLS}
    depends_on: [kafka]

  llm-gateway:
    build: ./services/llm-gateway
    <<: *common
    ports: ["8010:8010"]
    environment:
      <<: *py-env
      AZURE_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_API_BASE: ${AZURE_OPENAI_ENDPOINT}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
    depends_on: [kafka, redis]

  cost-normaliser:
    build: ./services/cost-normaliser
    command: python normaliser.py
    <<: *common
    environment: { <<: *py-env }
    depends_on: [kafka]

  token-tracker:
    build: ./services/token-tracker
    command: python consumer.py
    <<: *common
    environment: { <<: *py-env }
    depends_on: [kafka, timescaledb, clickhouse]

  gpu-monitor:
    build: ./services/gpu-monitor
    <<: *common
    ports: ["8021:8021"]
    environment:
      <<: *py-env
      AZURE_PROMETHEUS_URL: ${AZURE_PROMETHEUS_URL:-http://localhost:9090}
      OS_PROMETHEUS_URL: ${OS_PROMETHEUS_URL:-http://localhost:9091}
    depends_on: [kafka]

  anomaly-detector:
    build: ./services/anomaly-detector
    command: python detector.py
    <<: *common
    environment: { <<: *py-env }
    depends_on: [kafka]

  forecast-engine:
    build: ./services/forecast-engine
    <<: *common
    ports: ["8024:8024"]
    environment: { <<: *py-env }
    depends_on: [timescaledb]

  api-bff:
    build: ./services/api-bff
    <<: *common
    ports: ["8000:8000"]
    environment: { <<: *py-env }
    depends_on: [timescaledb, clickhouse, kafka]

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    <<: *common
    ports: ["5173:5173"]
    volumes: [./frontend:/app]
    environment:
      VITE_API_URL: http://localhost:8000

networks:
  finops: { driver: bridge }

volumes:
  kafka-data: {}
  timescale-data: {}
  clickhouse-data: {}
  redis-data: {}
